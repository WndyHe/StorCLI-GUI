name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  static-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install linter
        run: python -m pip install --disable-pip-version-check pyflakes

      - name: Compile Python sources
        run: python -m compileall -q storcli_gui.py tools

      - name: Run pyflakes
        run: python -m pyflakes storcli_gui.py tools/build_windows.py

  windows-build:
    name: Build Windows executable
    needs: static-checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build executable
        run: python tools/build_windows.py

      - name: Verify version and checksum
        shell: powershell
        run: |
          $appVersion = (Get-Content -LiteralPath build/app-version.txt -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $appVersion) {
              throw "Source version $appVersion does not match tag $tagVersion"
            }
          }
          $file = Get-Item -LiteralPath dist/StorCLI_GUI.exe
          if ($file.VersionInfo.ProductVersion -ne $appVersion) {
            throw "EXE version $($file.VersionInfo.ProductVersion) does not match source $appVersion"
          }
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
          "Version: $appVersion" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: StorCLI-GUI-windows-x64
          path: dist/StorCLI_GUI.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "StorCLI GUI $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create release $tag"
            }
          }
          gh release upload $tag dist/StorCLI_GUI.exe --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload executable to release $tag"
          }
